app = "xsettlers"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/xsettlers.db"
  GAME_CONFIG_PATH = "config/game_config.yaml"

# Volume must be created once before first deploy: fly volumes create xsettlers_data --size 1
[mounts]
  source = "xsettlers_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
