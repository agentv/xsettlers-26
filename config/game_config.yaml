game:
  name: "XSettlers MVP"
  tick_seconds: 300
  # Confidence points an unoccupied sector loses per turn (flat subtraction
  # from 100) -- 20 means a sector blinks off the map on the 5th turn after
  # it was last seen. Note: the engine currently reads this from the
  # CONFIDENCE_DECAY_PER_TURN env var (see db/sectors.py), not from here.
  confidence_decay_per_turn: 20
  # Engine-wide ceiling on how many players any one scenario may seat. It is a
  # ceiling only -- there is no floor, so a 1-participant solo scenario is
  # equally valid. How many players a *particular* game has is decided by that
  # scenario's participants list, not here.
  max_players: 8
  turn_limit: 20

  # (No `dimensions` or `feature_flags` keys -- both were removed 2026-08-11.
  # Neither was read by any code anywhere, and unlike tick_seconds/turn_limit/
  # confidence_decay_per_turn above there was no env var shadowing them either,
  # so there was nothing to reconcile: `dimensions: 2` had sat here contradicting
  # the loader's own default of 3 with nothing to notice. Re-add them alongside
  # the code that consumes them, not before.)

  # Points per stored unit, applied to a player's total held energy/food/goods
  # to compute the game score (show_game_status's "score" field, and the
  # actual game-over win condition in engine/turn.py's _calculate_final_scores).
  # Energy intentionally scores 0 -- it's a means to produce food/goods, not
  # a scored asset in its own right. Goods score double food.
  score_weights:
    energy: 0
    goods: 2
    food: 1

# (There is deliberately no starting_configuration_file key. This service is a
# library of games, not one game -- which scenario gets bootstrapped is chosen
# at runtime by a player via select_scenario(), so a file-level "the scenario
# is this one" pointer would be a second, weaker declaration of the same thing.
# Removed 2026-07-30.)

# Sectors are lazily instantiated (see db/sectors.py's reveal_sector()) --
# no sector exists in the DB until a player reveals it via bootstrap
# placement, ship arrival, or a resolved scan. There is no pre-seeded grid
# and nothing to configure here.

# PLAYER DIRECTORY -- who exists on this service. This is NOT a game roster:
# it says nothing about which games anyone plays. Each scenario file names its
# own participants, referencing these entries by email (see config/game0.yaml).
# One person, one entry, one credential -- so a player who appears in five
# scenarios still has exactly one token, in exactly one place.
#
# player_token is each player's actual credential -- opaque, generated (e.g.
# `python3 -c "import secrets; print(secrets.token_urlsafe(24))"`), not a
# public-looking platform ID. Whatever client a player uses (Slack, curl,
# another LLM agent) passes this token as the player_token argument on every
# tool call; xsettlers_mcp/auth.py compares it against this directory. Tokens
# deliberately never appear in a scenario file.
#
# SECURITY: this file is committed to git. The placeholder values below are
# NOT real secrets -- generate fresh tokens before any real deployment, and
# treat this file as sensitive from that point on (consider gitignoring a
# real deployment's copy, same as .env, rather than committing live tokens).
players:
  - {email: "vincent@example.com", display_name: "Vincent", player_token: "REPLACE_WITH_GENERATED_TOKEN_1"}
  - {email: "player2@example.com", display_name: "Player Two", player_token: "REPLACE_WITH_GENERATED_TOKEN_2"}
  # Added for config/game_crowd.yaml ("The Crowd"), which needs two players the
  # directory did not have. Names are the scenario's colours rather than
  # people's names -- the directory is identity, so a display_name here is what
  # every other player sees, and "Blue"/"Red" is what that scenario is about.
  - {email: "blue@example.com", display_name: "Blue", player_token: "REPLACE_WITH_GENERATED_TOKEN_3"}
  - {email: "red@example.com", display_name: "Red", player_token: "REPLACE_WITH_GENERATED_TOKEN_4"}
