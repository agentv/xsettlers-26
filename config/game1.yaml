# Starting configuration for XSettlers -- Outbreak (game1).
# One foothold, and a fleet to expand from it. See docs/player_guide.md's
# "Scenario One: Outbreak" section for the full narrative description --
# this file is the first actual implementation of that scenario (previously
# described in the player guide, under the name Diaspora, but never built
# as a real config/game*.yaml -- see docs/TODO.md for the renaming history).

name: "Outbreak"
description: >
  Each player begins with an established colony at their home sector plus a
  fleet of 8 ships, all producing from turn 1. Home sectors are set apart
  for a real early-game exploration phase before rivals make contact.

# See config/game0.yaml for the participants format. `player` references an
# email in config/game_config.yaml's player directory.
participants:
  - {player: "vincent@example.com", home_sector: [25, 25, 0]}
  - {player: "player2@example.com", home_sector: [12, 12, 0]}

ships_per_player: 8

# How full every pod starts, as a fraction of its storage_capacity. See
# config/game0.yaml for why this dropped from 1.0 to 0.3 on 2026-08-02.
# Per-scenario by design -- a future variant is free to start rich again.
starting_fill: 0.3

# Energy in each player's home sector, overriding the ordinary discovery roll
# (db/sectors.py rolls 400 + d6 x 100 -- 500 to 1000 -- for everywhere else).
# Deliberately bottomless rather than merely generous: a player's own footing
# should never be the thing that runs out from under them, which is what lets
# the frontier be lean. Per-scenario by design -- a survival variant is free to
# make home as poor as anywhere else. NOTE: this is the home sector, not the
# "sentinel sector" (id = -1), which parks ships in transit and stays at 0.
home_sector_energy: 100000

# Same 6-pod loadout as game0's Diaspora, applied to every ship AND
# to the home colony (see home_colony below and db/bootstrap.py).
pods_per_ship:
  - {task: produce_energy, count: 2, storage_capacity: 100.0}
  - {task: produce_goods,  count: 2, storage_capacity: 100.0}
  - {task: produce_food,   count: 2, storage_capacity: 100.0}

# Unlike game0's Diaspora, Outbreak starts each player with an established
# colony at their home sector -- a fixed foothold from turn 1.
home_colony: true
