# Fast, simultaneous multi-direction departure, plus committing part of the
# fleet to colonizing immediately rather than staying mobile -- betting that
# the colony production multiplier compounding over the rest of the game beats
# keeping full flexibility.
#
# Winner of the 2026-08-10 round robin at 2582, ahead of every other
# registered strategy. Also the pattern run as "Vincent" in the earlier
# Diaspora mock-run (6 ships fanned out, 2 colonized turn 1), 2574 to a turtle
# opponent's 2240.
#
# Step order is load-bearing for reproducibility, not just taste: the ported
# Python dispatched every move before any colonize, so the events table only
# matches if this file does the same.
name: burst_and_colonize
description: Everyone commits at once -- most of the fleet scatters, the rest plants colonies turn one.
program:
  # Ships 2..7 scatter, one cardinal direction each, cycling N/S/E/W.
  - ships: {slice: [2, 8]}
    when: now
    action: move
    params:
      - {d_x: 0,  d_y: -3, d_z: 0}   # north is -y (see sector_tools.SCAN_BEARINGS)
      - {d_x: 0,  d_y: 3,  d_z: 0}
      - {d_x: 3,  d_y: 0,  d_z: 0}
      - {d_x: -3, d_y: 0,  d_z: 0}
  # Ships 0..1 -- a quarter of an 8-ship fleet -- stay and become colonies.
  # A fixed slice, not a fraction: the Python version scaled this with fleet
  # size and a program cannot yet express that (see docs/TODO.md).
  - ships: {slice: [0, 2]}
    when: now
    action: colonize
