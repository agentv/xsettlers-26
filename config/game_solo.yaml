# Solo scenario -- the first one-player game, and the proof that the
# participants model actually supports variable roster sizes. Nothing here is
# special-cased in code: a solo game is just a scenario whose participants
# list has one entry.
#
# Discovered automatically by xsettlers_mcp/game_select.py's list_scenarios()
# because the filename matches config/game*.yaml.
#
# NOTE: named provisionally. If this becomes the tutorial / "scenario zero",
# rename the file and the `name` below to match.

name: "Solo"
description: >
  A single-player scenario for trying the engine out without waiting on anyone:
  one fleet, no rivals, and consensus acceleration means declaring end of turn
  advances the clock immediately instead of waiting for the tick.

participants:
  - {player: "vincent@example.com", home_sector: [10, 10, 0]}

ships_per_player: 8

# How full every pod starts, as a fraction of its storage_capacity. 0.3 --
# the same level every shipped scenario uses, stated explicitly here because
# it is a scenario decision, not an engine constant.
# Replaced the original 1.0 on 2026-07-30: a fleet starting at capacity cannot
# accumulate, so its production is waste and only spending moves the score.
# Starting lean makes production the game.
starting_fill: 0.3

# Energy in each player's home sector, overriding the ordinary discovery roll
# (db/sectors.py rolls 400 + d6 x 100 -- 500 to 1000 -- for everywhere else).
# Deliberately bottomless rather than merely generous: a player's own footing
# should never be the thing that runs out from under them, which is what lets
# the frontier be lean. Per-scenario by design -- a survival variant is free to
# make home as poor as anywhere else. NOTE: this is the home sector, not the
# "sentinel sector" (id = -1), which parks ships in transit and stays at 0.
home_sector_energy: 100000

pods_per_ship:
  - {task: produce_energy, count: 2, storage_capacity: 100.0}
  - {task: produce_goods,  count: 2, storage_capacity: 100.0}
  - {task: produce_food,   count: 2, storage_capacity: 100.0}

home_colony: true

# GameHouse lobby template -- see config/game0.yaml for the general
# rationale. Solo is the one scenario where min_players == max_players == 1
# makes wait_window_seconds and npc_profile_schema structurally unreachable:
# per GameHouse's own lobby logic ("if a lobby reaches the game's declared
# max player count, it closes immediately"), a solo lobby always closes on
# the first join -- there's never a gap to wait out or an NPC to backfill.
# Both fields are still supplied (rather than omitted) since GameHouse's
# describe_lobby contract expects them present; values are nominal, not
# meaningful defaults to reuse if this scenario ever grows past 1 player.
lobby:
  min_players: 1
  max_players: 1
  wait_window_seconds: 0
  npc_profile_schema:
    type: object
    required: [strategy_name]
    properties:
      strategy_name:
        type: string
        enum: []
