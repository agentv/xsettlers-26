game:
  name: "XSettlers MVP"
  tick_seconds: 300
  confidence_decay: 0.9
  max_players: 2
  turn_limit: 20
  dimensions: 2

  feature_flags:
    combat_enabled: false
    sensor_pods_enabled: false
    pod_reconfig_enabled: false

  score_weights:
    energy: 1
    goods: 1
    food: 1

# Path to the starting configuration file for this game instance.
# Swap this to use a different starting configuration (e.g. game1.yaml).
starting_configuration_file: config/game0.yaml

# 16x16 grid — all sectors seeded at bootstrap
# Only a representative sample shown here; full 256-sector list generated by bootstrap
sectors:
  - coords: [0, 0, 0]
    energy_capacity: 80.0
    food_capacity: 60.0
    goods_capacity: 40.0
  - coords: [3, 3, 0]    # Player 1 home sector
    energy_capacity: 100.0
    food_capacity: 100.0
    goods_capacity: 100.0
  - coords: [12, 12, 0]  # Player 2 home sector
    energy_capacity: 100.0
    food_capacity: 100.0
    goods_capacity: 100.0
  # ... full 256 sectors seeded procedurally in bootstrap_game

# player_token is each player's actual credential -- opaque, generated (e.g.
# `python3 -c "import secrets; print(secrets.token_urlsafe(24))"`), not a
# public-looking platform ID. Whatever client a player uses (Slack, curl,
# another LLM agent) passes this token as the player_token argument on every
# tool call; xsettlers_mcp/auth.py compares it against this roster.
#
# SECURITY: this file is committed to git. The placeholder values below are
# NOT real secrets -- generate fresh tokens before any real deployment, and
# treat this file as sensitive from that point on (consider gitignoring a
# real deployment's copy, same as .env, rather than committing live tokens).
players:
  - {email: "vincent@example.com", display_name: "Vincent", player_token: "REPLACE_WITH_GENERATED_TOKEN_1"}
  - {email: "player2@example.com", display_name: "Player Two", player_token: "REPLACE_WITH_GENERATED_TOKEN_2"}
