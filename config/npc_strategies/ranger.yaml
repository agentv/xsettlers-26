# Charting as much of the board as possible: one ship per compass heading,
# looping for the whole game. Never colonizes and never converges -- both
# would pull a ship out of the 'idle' selector this loops on for good, which
# is exactly the turns this document exists to keep spending on new ground.
#
# Each stop fires three scanners in the same tick instead of one: pod 2 looks
# forward (the direction just travelled), pod 3 looks rear (back the way it
# came), and the org's own sensor looks flank -- one bearing clockwise of
# heading, the aim the single-scanner version of this document already
# measured as a slight edge over aiming straight down the line of travel.
# Together that is near-360-degree coverage per stop in the one tick the
# ship actually stands still before its next move fires, rather than a
# second dwell turn -- `loop: true` has no "arrival + 1" trigger to hold a
# ship an extra turn without freezing the other seven behind a `decide` gate
# (measured: 33 sectors, worse than a stray aim -- see docs/ranger_tuning_brief.md
# in the design bench for the full comparison).
#
# In transit, pod 2 makes food and pod 3 makes goods. Both were produce_goods
# stock configuration before; a ranger's own food pods are the only consumer
# of that goods output; splitting one pod to food directly keeps the food
# pods fed without routing the whole draw through a goods intermediate.
name: ranger
description: >
  Eight ships hold eight compass headings and never stop advancing. On
  arrival at each waypoint, three scanners fire the same tick -- forward
  (pod 2), rear (pod 3), and flank (the org's own sensor) -- for near-
  360-degree coverage per stop instead of one narrow look. In transit,
  pod 2 makes food and pod 3 makes goods, so the produce_goods pods' fixed
  cost buys the resources that actually keep the ship solvent.
loop: true
steps:
  - order:
      ships: idle
      action: move
      params:
        - {d_x: 0,  d_y: -2, d_z: 0}   # N
        - {d_x: 2,  d_y: -2, d_z: 0}   # NE
        - {d_x: 2,  d_y: 0,  d_z: 0}   # E
        - {d_x: 2,  d_y: 2,  d_z: 0}   # SE
        - {d_x: 0,  d_y: 2,  d_z: 0}   # S
        - {d_x: -2, d_y: 2,  d_z: 0}   # SW
        - {d_x: -2, d_y: 0,  d_z: 0}   # W
        - {d_x: -2, d_y: -2, d_z: 0}   # NW

  # Under way: pod 2 -> food, pod 3 -> goods (split, not both on one task).
  - order: {ships: idle, action: set_pod_task, when: upon_departure,
           params: {task: produce_food, pod_index: 2}}
  - order: {ships: idle, action: set_pod_task, when: upon_departure,
           params: {task: produce_goods, pod_index: 3}}

  # Forward: pod 2, same direction as the heading just taken.
  - order:
      ships: idle
      action: set_pod_task
      when: upon_arrival
      params:
        - {task: scan, pod_index: 2, bearing: N2}
        - {task: scan, pod_index: 2, bearing: NE}
        - {task: scan, pod_index: 2, bearing: E2}
        - {task: scan, pod_index: 2, bearing: SE}
        - {task: scan, pod_index: 2, bearing: S2}
        - {task: scan, pod_index: 2, bearing: SW}
        - {task: scan, pod_index: 2, bearing: W2}
        - {task: scan, pod_index: 2, bearing: NW}

  # Rear: pod 3, opposite the heading.
  - order:
      ships: idle
      action: set_pod_task
      when: upon_arrival
      params:
        - {task: scan, pod_index: 3, bearing: S2}
        - {task: scan, pod_index: 3, bearing: SW}
        - {task: scan, pod_index: 3, bearing: W2}
        - {task: scan, pod_index: 3, bearing: NW}
        - {task: scan, pod_index: 3, bearing: N2}
        - {task: scan, pod_index: 3, bearing: NE}
        - {task: scan, pod_index: 3, bearing: E2}
        - {task: scan, pod_index: 3, bearing: SE}

  # Flank: the org's own sensor, one bearing clockwise of heading -- the
  # aim this document measured as a slight edge over straight-ahead.
  - order:
      ships: idle
      action: aim_scan
      when: upon_arrival
      params:
        - {bearing: NE}
        - {bearing: E2}
        - {bearing: SE}
        - {bearing: S2}
        - {bearing: SW}
        - {bearing: W2}
        - {bearing: NW}
        - {bearing: N2}
