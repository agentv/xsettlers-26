# Starting configuration for XSettlers MVP (game0).
# To create a new game variant, copy this file, rename it (e.g. game1.yaml).
# It's automatically discoverable via xsettlers_mcp/game_select.py's
# list_scenarios() -- no need to touch game_config.yaml. name/description
# are required and shown to players when they're choosing which scenario
# to play.

name: "Diaspora"
description: >
  The default MVP scenario. Two players, 8 ships each, no starting colony --
  everyone begins mobile and picks their own moment to colonize.

# Who plays this scenario, and where each of them starts. `player` references
# an email in config/game_config.yaml's player directory -- tokens live there,
# never here. The length of this list IS the player count for this scenario:
# one entry is a solo game, five entries a five-player game, no code change
# either way. Add `is_npc: true` to an entry to have it seeded as an NPC.
participants:
  - {player: "vincent@example.com", home_sector: [25, 25, 0]}
  - {player: "player2@example.com", home_sector: [25, 50, 0]}

ships_per_player: 8

# How full every pod starts, as a fraction of its storage_capacity. Stated
# explicitly rather than left to the default, because how rich a game begins
# is a scenario decision -- every scenario declares its own, and none inherits
# one silently.
#
# Lowered 1.0 -> 0.3 on 2026-08-02. At 1.0 the fleet begins at capacity, which
# hid every economic pressure this scenario exists to exercise: production had
# nowhere to go so it was pure waste, and the starting energy stockpile was
# large enough to coast all 20 turns, so a player who stripped their sector
# bare never actually paid for it. Pod templates below may still override this.
starting_fill: 0.3

# Energy in each player's home sector, overriding the ordinary discovery roll
# (db/sectors.py rolls 400 + d6 x 100 -- 500 to 1000 -- for everywhere else,
# scaled by the `map:` block below where one applies).
#
# Rich but finite, and calibrated: a fleet that colonizes in place on turn one
# and never leaves empties this on turn 16 of a 20-turn game. Deep enough to
# build from, shallow enough that never expanding is visibly a choice. See
# config/loader.py's HOME_SECTOR_ENERGY for the arithmetic. Per-scenario by
# design -- a survival variant is free to make home as poor as anywhere else.
# NOTE: this is the home sector, not the "sentinel sector" (id = -1), which
# parks ships in transit and stays at 0.
home_sector_energy: 2200

# Each ship receives one pod per entry below, repeated `count` times.
# Mission values are the canonical pod missions (see Product Requirements /
# Data Model & Storage Design): idle | produce_energy | produce_food | produce_goods | scan.
# Input costs to run each mission live in engine/production.py's
# POD_CONSUMPTION_RECIPE, not here -- they're fixed per mission type, not
# configurable per scenario.
pods_per_ship:
  - {task: produce_energy, count: 2, storage_capacity: 100.0}
  - {task: produce_goods,  count: 2, storage_capacity: 100.0}
  - {task: produce_food,   count: 2, storage_capacity: 100.0}

# Set to true to spawn a starting colony at each player's home sector.
home_colony: false

# Optional. Where this scenario's map is richer (or leaner) than open space.
# Absent, as here, means every sector takes the ordinary 500-1000 roll.
#
# A multiplier scales the WHOLE roll, so x3 rolls 1500-3000 -- a hotspot is a
# better place, not a longer-odds bet. Overlapping regions take the largest
# multiplier, never the product. Values below 1.0 are legal and mark a lean
# region; there is no separate vocabulary for a desert.
#
# The layout is never exposed to players -- no tool reads it. A scenario's map
# is discovered by revealing into it and reading what a sector rolled, so a
# scenario is free to keep its geography secret from the people playing it.
#
# `hotspots` places regions by hand; `scatter` draws them from the map seed at
# bootstrap (so a seeded game lays the same board down every time). Use both
# together when some regions must be guaranteed and the rest can be dealt.
#
# map:
#   hotspots:
#     - {center: [25, 18, 0], radius: 2, multiplier: 3.0}
#   scatter:
#     count: 10
#     within: {min: [15, 15, 0], max: [35, 35, 0]}
#     radius: [1, 2]
#     multiplier: [2.0, 2.5]

# GameHouse lobby template (added 2026-08-06) -- the shape this scenario
# reports via describe_lobby(), so GameHouse's catalog can register it as its
# own entry rather than xsettlers exposing one lobby shape for all scenarios.
# No min_players/max_players here -- config/loader.py derives both from
# len(participants) above rather than reading them, since a separately
# authored number here could only ever drift out of sync with the roster it's
# supposed to describe.
lobby:
  # Confirmed 2026-08-06: 120s is fine as a starting value (360s also
  # acceptable if it ever needs lengthening) -- how long GameHouse should
  # wait for a second human before backfilling with an NPC.
  wait_window_seconds: 120
  # No npc_profile_schema here -- it is derived from the strategy library
  # (config/npc_strategies/) by xsettlers_mcp/gamehouse.py at registration
  # time. The library is service-wide, so a per-scenario copy of the strategy
  # list could only go stale.
